name: CD

on:
  push:
    branches: [ main ]
  schedule:
    # 매일 오전 9시 (KST) = UTC 00:00
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: '실행할 작업 선택'
        required: true
        default: 'backfill'
        type: choice
        options:
          - backfill
          - train
          - backfill-and-train

jobs:
  # ── 배포 (main 머지 시에만) ────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-northeast-2 | \
              docker login --username AWS --password-stdin \
              $(aws sts get-caller-identity --query Account --output text).dkr.ecr.ap-northeast-2.amazonaws.com

            cd ~/stockmind-mini
            git pull origin main
            docker pull $(grep 'image:' docker-compose.yml | head -1 | awk '{print $2}') || true
            docker compose up -d db api
            echo "✅ 배포 완료"

  # ── 수동 작업 (workflow_dispatch) ────────────────────────
  manual:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Run on EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 60m
          script: |
            cd ~/stockmind-mini
            git pull origin main

            JOB="${{ github.event.inputs.job }}"

            if [ "$JOB" = "backfill" ] || [ "$JOB" = "backfill-and-train" ]; then
              echo "=== backfill 시작 ==="
              docker compose exec -T api python scripts/backfill.py
              echo "=== backfill 완료 ==="
            fi

            if [ "$JOB" = "train" ] || [ "$JOB" = "backfill-and-train" ]; then
              echo "=== 모델 학습 시작 ==="
              docker compose exec -T api python src/ml/train.py
              echo "=== 임계값 튜닝 시작 ==="
              docker compose exec -T api python src/ml/tune_threshold.py
              echo "=== 학습 완료 ==="
            fi

  # ── 파이프라인 (매일 cron + main 머지 시) ─────────────────
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          which chromium-browser || which chromium

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          USE_REMOTE_WEBDRIVER: "false"
          CHROME_BIN: /usr/bin/chromium-browser
          PYTHONPATH: src
          YF_MAX_SCROLL: "10"
          YF_MAX_ARTICLES: "30"
          PRICE_PERIOD: "5d"
          PRICE_INTERVAL: "1d"
        run: python src/main.py
