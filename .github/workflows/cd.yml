name: CD

on:
  push:
    branches: [ main ]
  schedule:
    # 매일 오전 9시 (KST) = UTC 00:00
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: '실행할 작업 선택'
        required: true
        default: 'backfill'
        type: choice
        options:
          - backfill
          - train
          - backfill-and-train

jobs:
  # ── 배포 (main 머지 시에만) ────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-northeast-2 | \
              docker login --username AWS --password-stdin \
              $(aws sts get-caller-identity --query Account --output text).dkr.ecr.ap-northeast-2.amazonaws.com

            cd ~/stockmind-mini
            git pull origin main
            docker compose pull api
            docker compose up -d --force-recreate api
            docker compose up -d db
            echo "✅ 배포 완료"

  # ── 수동 작업 (workflow_dispatch) ────────────────────────
  manual:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Run on EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 60m
          script: |
            cd ~/stockmind-mini
            git pull origin main

            JOB="${{ github.event.inputs.job }}"

            if [ "$JOB" = "backfill" ] || [ "$JOB" = "backfill-and-train" ]; then
              echo "=== backfill 시작 ==="
              docker compose exec -T api python scripts/backfill.py
              echo "=== backfill 완료 ==="
            fi

            if [ "$JOB" = "train" ] || [ "$JOB" = "backfill-and-train" ]; then
              echo "=== 모델 학습 시작 ==="
              docker compose exec -T api python src/ml/train.py
              echo "=== 임계값 튜닝 시작 ==="
              docker compose exec -T api python src/ml/tune_threshold.py
              echo "=== 학습 완료 ==="
            fi

  # ── 파이프라인 (매일 cron + main 머지 시) ─────────────────
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          which chromium-browser || which chromium

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          USE_REMOTE_WEBDRIVER: "false"
          CHROME_BIN: /usr/bin/chromium-browser
          PYTHONPATH: src
          YF_MAX_SCROLL: "10"
          YF_MAX_ARTICLES: "30"
          PRICE_PERIOD: "5d"
          PRICE_INTERVAL: "1d"
        run: python src/main.py

  # ── 재학습 (pipeline + deploy 완료 후, Actions runner에서 실행) ─────
  retrain:
    runs-on: ubuntu-latest
    needs: [pipeline, deploy]
    if: always() && needs.pipeline.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Download existing models from EC2
        run: |
          mkdir -p models
          scp -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/stockmind-mini/models/* \
            models/ || echo "기존 모델 없음, 첫 학습으로 진행"

      - name: Train models
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: src
        run: |
          echo "=== 재학습 시작 ==="
          python src/ml/train.py
          echo "=== 재학습 완료 ==="

      - name: Evaluate and compare
        env:
          PYTHONPATH: src
        run: |
          echo "=== eval_compare ==="
          python src/ml/eval_compare.py

      - name: Tune threshold
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: src
        run: |
          echo "=== tune_threshold ==="
          python src/ml/tune_threshold.py

      - name: Upload models to EC2
        run: |
          echo "=== 모델 업로드 ==="
          scp -i ~/.ssh/ec2_key \
            models/* \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/stockmind-mini/models/
          echo "✅ 모델 업로드 완료"

      - name: Reload API on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/stockmind-mini
            docker compose restart api
            echo "✅ API 재시작 완료 (새 모델 로드)"

  # ── 예측 호출 (retrain 완료 후) ──────────────────────────
  predict:
    runs-on: ubuntu-latest
    needs: retrain
    continue-on-error: true

    steps:
      - name: Call prediction API on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            for TICKER in "005930.KS" "TSLA"; do
              echo "=== [$TICKER] 예측 호출 ==="
              curl -sf --connect-timeout 10 --max-time 60 \
                "http://localhost:8000/stocks/$TICKER/prediction" | python3 -m json.tool || \
                echo "[$TICKER] 예측 실패 (모델 미존재 또는 API 오류)"
            done

  # ── 이메일 알림 (predict 완료 후) ────────────────────────
  notify:
    runs-on: ubuntu-latest
    needs: predict

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install sqlalchemy psycopg2-binary python-dotenv

      - name: Send prediction email
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          PYTHONPATH: src
        run: python src/notify.py
